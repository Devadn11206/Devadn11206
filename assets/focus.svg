<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&amp;display=swap');
      * { font-family: 'Inter', -apple-system, sans-serif; }
      .bg { fill: #050816; }
      .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.08); stroke-width: 1px; rx: 16px; }
      .text-title { font-size: 32px; font-weight: 800; fill: #F8FAFC; }
      .text-h2 { font-size: 24px; font-weight: 700; fill: #F8FAFC; }
      .text-p { font-size: 15px; font-weight: 400; fill: #94A3B8; line-height: 1.5; }
      .text-sm { font-size: 13px; font-weight: 400; fill: #94A3B8; }
      .highlight { fill: #38BDF8; font-weight: 600; }
      .badge { fill: rgba(56, 189, 248, 0.1); stroke: rgba(56, 189, 248, 0.3); stroke-width: 1px; rx: 6px; }
      .badge-text { font-size: 12px; font-weight: 600; fill: #38BDF8; }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
<rect class="card" x="20" y="20" width="180" height="75"/>
<text class="text-sm" x="110" y="50" text-anchor="middle" font-family="monospace" fill="#38BDF8" font-size="11">AGENTS</text>
<text class="text-p" x="110" y="75" text-anchor="middle" font-weight="600" fill="#F8FAFC" font-size="13">Autonomous AI Agents</text>
<rect class="card" x="210" y="20" width="180" height="75"/>
<text class="text-sm" x="300" y="50" text-anchor="middle" font-family="monospace" fill="#38BDF8" font-size="11">PINN</text>
<text class="text-p" x="300" y="75" text-anchor="middle" font-weight="600" fill="#F8FAFC" font-size="13">Physics-Informed NNs</text>
<rect class="card" x="400" y="20" width="180" height="75"/>
<text class="text-sm" x="490" y="50" text-anchor="middle" font-family="monospace" fill="#38BDF8" font-size="11">SCI-ML</text>
<text class="text-p" x="490" y="75" text-anchor="middle" font-weight="600" fill="#F8FAFC" font-size="13">Scientific Machine Learning</text>
<rect class="card" x="590" y="20" width="180" height="75"/>
<text class="text-sm" x="680" y="50" text-anchor="middle" font-family="monospace" fill="#38BDF8" font-size="11">RL</text>
<text class="text-p" x="680" y="75" text-anchor="middle" font-weight="600" fill="#F8FAFC" font-size="13">Reinforcement Learning</text>
<rect class="card" x="20" y="110" width="180" height="75"/>
<text class="text-sm" x="110" y="140" text-anchor="middle" font-family="monospace" fill="#38BDF8" font-size="11">RAG</text>
<text class="text-p" x="110" y="165" text-anchor="middle" font-weight="600" fill="#F8FAFC" font-size="13">Retrieval-Augmented Gen</text>
<rect class="card" x="210" y="110" width="180" height="75"/>
<text class="text-sm" x="300" y="140" text-anchor="middle" font-family="monospace" fill="#38BDF8" font-size="11">LLM</text>
<text class="text-p" x="300" y="165" text-anchor="middle" font-weight="600" fill="#F8FAFC" font-size="13">Large Language Models</text>
<rect class="card" x="400" y="110" width="180" height="75"/>
<text class="text-sm" x="490" y="140" text-anchor="middle" font-family="monospace" fill="#38BDF8" font-size="11">BACKEND</text>
<text class="text-p" x="490" y="165" text-anchor="middle" font-weight="600" fill="#F8FAFC" font-size="13">Backend Architecture</text>
<rect class="card" x="590" y="110" width="180" height="75"/>
<text class="text-sm" x="680" y="140" text-anchor="middle" font-family="monospace" fill="#38BDF8" font-size="11">DIST</text>
<text class="text-p" x="680" y="165" text-anchor="middle" font-weight="600" fill="#F8FAFC" font-size="13">Distributed AI Systems</text>

</svg>