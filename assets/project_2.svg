<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&amp;display=swap');
      * { font-family: 'Inter', -apple-system, sans-serif; }
      .bg { fill: #050816; }
      .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.08); stroke-width: 1px; rx: 16px; }
      .text-title { font-size: 32px; font-weight: 800; fill: #F8FAFC; }
      .text-h2 { font-size: 24px; font-weight: 700; fill: #F8FAFC; }
      .text-p { font-size: 15px; font-weight: 400; fill: #94A3B8; line-height: 1.5; }
      .text-sm { font-size: 13px; font-weight: 400; fill: #94A3B8; }
      .highlight { fill: #38BDF8; font-weight: 600; }
      .badge { fill: rgba(56, 189, 248, 0.1); stroke: rgba(56, 189, 248, 0.3); stroke-width: 1px; rx: 6px; }
      .badge-text { font-size: 12px; font-weight: 600; fill: #38BDF8; }
    </style>
  </defs>
  
  <rect class="bg" width="100%" height="100%"/>
  <rect class="card" x="10" y="10" width="370" height="220" style="transition: all 0.3s ease;"/>
  <text class="text-h2" x="30" y="50" font-size="18">DreamScape AI</text>
  <text class="text-p" x="30" y="80" font-size="13.5">Cinematic AI storytelling platform generating multimedia narratives.</text>
  
  <text class="text-sm" x="30" y="130" fill="#7C3AED" font-weight="600">Architecture</text>
  <text class="text-sm" x="130" y="130">Celery Orchestration</text>
  
  <text class="text-sm" x="30" y="160" fill="#7C3AED" font-weight="600">Tech Stack</text>
  <text class="text-sm" x="130" y="160">FastAPI, Gemini, Supabase</text>
  
  <text class="text-sm" x="30" y="190" fill="#7C3AED" font-weight="600">Status</text>
  <text class="text-sm" x="130" y="190">Live</text>
  
  <g transform="translate(340, 42)">
     <circle cx="0" cy="0" r="14" fill="rgba(255,255,255,0.05)"/>
     <path d="M-3,-4 L3,0 L-3,4" fill="none" stroke="#38BDF8" stroke-width="2"/>
  </g>
  
</svg>