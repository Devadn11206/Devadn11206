<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&amp;display=swap');
      * { font-family: 'Inter', -apple-system, sans-serif; }
      .bg { fill: #050816; }
      .card { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.08); stroke-width: 1px; rx: 16px; }
      .text-title { font-size: 32px; font-weight: 800; fill: #F8FAFC; }
      .text-h2 { font-size: 24px; font-weight: 700; fill: #F8FAFC; }
      .text-p { font-size: 15px; font-weight: 400; fill: #94A3B8; }
      .text-sm { font-size: 13px; font-weight: 400; fill: #94A3B8; }
      .highlight { fill: #38BDF8; font-weight: 600; }
      .badge { fill: rgba(56, 189, 248, 0.1); stroke: rgba(56, 189, 248, 0.3); stroke-width: 1px; rx: 6px; }
      .badge-text { font-size: 12px; font-weight: 600; fill: #38BDF8; }
    </style>
  </defs>
  
  <rect class="bg" width="100%" height="100%"/>
  <rect class="card" x="20" y="20" width="760" height="240"/>
  <text class="text-h2" x="50" y="65">Research &amp; Publications</text>
  
  <g transform="translate(50, 100)">
    <path d="M10 10 L10 120" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.5"/>
    
    <circle cx="10" cy="15" r="5" fill="#38BDF8"/>
    <text class="text-sm" x="30" y="20" fill="#F8FAFC" font-weight="600">Physics-Informed Neural Networks for Traffic Optimization</text>
    <text class="text-sm" x="30" y="40" fill="#94A3B8">In Progress • Investigating PINNs for non-linear traffic flow PDEs.</text>

    <circle cx="10" cy="85" r="5" fill="#38BDF8"/>
    <text class="text-sm" x="30" y="90" fill="#F8FAFC" font-weight="600">Multi-Agent Systems in Bureaucratic Navigation</text>
    <text class="text-sm" x="30" y="110" fill="#94A3B8">Preprint • Architecting robust agent-based collaboration frameworks.</text>
  </g>

</svg>